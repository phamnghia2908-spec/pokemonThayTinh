<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pokémon Bird Shoot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffcb05;
            --gold-deep: #ff9500;
            --ember: #ff6b6b;
            --mint: #2ecc71;
            --sky-cyan: #7ee6ff;
            --violet: #7a5cff;
            --ink: #0a0616;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
            background: #05030c;
            color: #fff;
            overscroll-behavior: none;
        }

        body::before {
            content: "";
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 60% 40% at 20% 10%, rgba(122, 92, 255, 0.2), transparent 60%),
                radial-gradient(ellipse 50% 35% at 85% 15%, rgba(255, 149, 0, 0.15), transparent 60%),
                linear-gradient(180deg, #0d0720 0%, #05030c 60%, #050308 100%);
        }

        .game-viewport {
            position: relative; z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            padding-top: var(--safe-t);
        }

        /* ============ THANH TRẠNG THÁI TRÊN CÙNG (HUD) ============ */
        #top-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(5px, 1.6vw, 12px);
            padding: clamp(8px, 1.6vh, 12px) clamp(10px, 3vw, 22px);
            background: linear-gradient(180deg, rgba(20,14,38,0.92) 0%, rgba(14,10,26,0.78) 100%);
            border-bottom: 1.5px solid rgba(255,203,5,0.4);
            box-shadow: 0 6px 24px rgba(0,0,0,0.45);
            position: relative;
            z-index: 40;
            backdrop-filter: blur(6px);
        }
        #top-bar::after {
            content: "";
            position: absolute; left: 0; right: 0; bottom: -1.5px; height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.7;
        }
        .brand-badge {
            display: flex; align-items: center; gap: 6px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: clamp(10px, 2vw, 14px);
            color: var(--gold);
            text-shadow: 0 0 12px rgba(255,203,5,0.5);
            letter-spacing: 0.3px;
            white-space: nowrap;
            opacity: 0.92;
        }
        .brand-badge .pika-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 60%, var(--gold-deep));
            box-shadow: 0 0 8px var(--gold);
            animation: dotPulse 1.6s ease-in-out infinite;
        }
        @keyframes dotPulse { 0%,100%{ transform: scale(1); opacity:1; } 50%{ transform: scale(1.35); opacity:.6; } }

        .hud-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: clamp(12px, 2.3vw, 17px);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,203,5,0.32);
            padding: clamp(4px,1vh,7px) clamp(8px,2vw,16px);
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 3px 10px rgba(0,0,0,0.3);
        }
        .hud-chip .icon { font-size: clamp(13px, 2.5vw, 18px); filter: drop-shadow(0 0 4px rgba(0,0,0,.5)); }
        .hud-chip.score { color: var(--sky-cyan); }
        .hud-chip.level { color: #d7c4ff; padding: clamp(4px,1vh,7px) clamp(8px,1.6vw,12px); }
        .hud-chip.weapon { color: #ffcf8a; padding: clamp(4px,1vh,7px) clamp(8px,1.6vw,12px); }

        #heartsBox { display: flex; gap: 1.5px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 30vw; }
        #heartsBox .heart-icon {
            font-size: clamp(9px, 1.9vw, 14px);
            filter: drop-shadow(0 0 5px rgba(255,90,90,.75));
            transition: opacity .25s ease, filter .25s ease, transform .25s ease;
            animation: heartBeat 1.8s ease-in-out infinite;
        }
        #heartsBox .heart-icon:nth-child(2n) { animation-delay: .15s; }
        @keyframes heartBeat { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.12); } }
        .heart-lost { opacity: 0.18 !important; filter: grayscale(1) !important; transform: scale(0.85) !important; animation: none !important; }

        /* ============ SÂN CHƠI (CANVAS) ============ */
        #shoot-stage {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(180deg, #6fb7e0 0%, #cfe8b8 62%, #8fbf5a 100%);
            cursor: crosshair;
        }
        #shootCanvas {
            display: block;
            touch-action: none;
        }
        #shoot-stage::after {
            content: "";
            position: absolute; inset: 0; pointer-events: none; z-index: 25;
            box-shadow: inset 0 120px 140px -120px rgba(0,0,0,0.55), inset 0 -160px 160px -120px rgba(0,0,0,0.5);
        }

        /* ============ MÀN HÌNH BẮT ĐẦU / ĐẾM NGƯỢC / CHỌN CẤP ĐỘ ============ */
        #shoot-overlay-layer {
            position: absolute; inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #shoot-overlay-layer.show { display: flex; }

        #tapStartCard {
            pointer-events: auto;
            text-align: center;
            animation: floatY 2.4s ease-in-out infinite;
        }
        @keyframes floatY { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
        #tapStartBtn {
            position: relative;
            width: clamp(96px, 24vw, 132px); height: clamp(96px, 24vw, 132px);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 32%, #fff 0 8%, #ffcb05 10% 46%, #a85f00 48% 54%, #fff 56% 60%, #eee 62% 100%);
            border: 5px solid #241143;
            box-shadow: 0 0 46px rgba(255,203,5,0.6), 0 10px 30px rgba(0,0,0,.5);
            cursor: pointer;
        }
        #tapStartBtn::before, #tapStartBtn::after {
            content: ""; position: absolute; inset: -14px; border-radius: 50%;
            border: 2px solid rgba(255,203,5,0.55); animation: ringPulse 2.2s ease-out infinite;
        }
        #tapStartBtn::after { animation-delay: 1.1s; }
        @keyframes ringPulse {
            0% { transform: scale(0.85); opacity: 0.9; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        #tapStartCard .tap-label {
            margin-top: 18px;
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(16px, 3.4vw, 21px);
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 18px rgba(255,203,5,.6), 2px 2px 0 #000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #tapStartCard .tap-sub {
            margin-top: 6px;
            font-size: clamp(11px, 2.2vw, 13px);
            color: #b9b3d6;
            font-weight: 600;
        }

        .countdown-num {
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(80px, 20vw, 150px);
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 40px #ff9500, 4px 4px 0 #000;
            animation: countPulse .9s ease forwards;
        }
        @keyframes countPulse {
            0% { transform: scale(0.3); opacity: 0; }
            30% { transform: scale(1.15); opacity: 1; }
            60% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .go-text {
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(56px, 15vw, 100px);
            font-weight: 800;
            color: var(--mint);
            text-shadow: 0 0 40px var(--mint), 4px 4px 0 #000;
            animation: countPulse 1s ease forwards;
        }

        /* ============ CẤP ĐỘ CHỌN ============ */
        .shoot-level-select-title {
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 800;
            color: var(--gold);
            text-shadow: 2px 2px 0 #000, 0 0 20px rgba(255,203,5,.4);
            margin-bottom: 22px;
        }
        .shoot-level-row { display: flex; gap: clamp(10px, 2.6vw, 18px); justify-content: center; flex-wrap: wrap; }
        .shoot-level-card {
            position: relative;
            background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
            border: 2px solid rgba(255,203,5,.35);
            border-radius: 20px;
            padding: clamp(16px, 3vw, 22px) clamp(18px, 4vw, 28px);
            text-align: center; cursor: pointer;
            min-width: clamp(108px, 22vw, 140px);
            box-shadow: 0 10px 26px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .shoot-level-card:hover { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 16px 34px rgba(0,0,0,0.5), 0 0 26px rgba(255,203,5,0.25); }
        .shoot-level-card:active { transform: scale(0.94) translateY(-2px); }
        .shoot-level-card .lv-emoji { font-size: clamp(30px, 7vw, 40px); filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
        .shoot-level-card .lv-label { font-family: 'Baloo 2', sans-serif; font-weight: 800; color: var(--gold); margin-top: 8px; font-size: clamp(14px, 3vw, 17px); }
        .shoot-level-card .lv-sub { font-size: clamp(10px, 2.2vw, 12px); color: #b9b3d6; margin-top: 5px; }

        /* ============ BANNER LÊN MÀN ============ */
        #level-banner {
            position: fixed; left: 50%; top: 20%; transform: translate(-50%, -18px);
            z-index: 4998; pointer-events: none; opacity: 0;
            transition: opacity .4s ease, transform .4s ease;
        }
        #level-banner.show { opacity: 1; transform: translate(-50%, 0); }
        .level-banner-txt {
            font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: clamp(18px, 4.6vw, 30px);
            color: #fff;
            background: linear-gradient(135deg, rgba(20,14,38,0.9), rgba(48,32,80,0.9));
            border: 2px solid rgba(255,203,5,0.6); border-radius: 30px; padding: 10px 30px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 0 34px rgba(255,203,5,0.28);
            text-shadow: 0 2px 4px rgba(0,0,0,.6);
            white-space: nowrap;
        }
        .level-banner-sub {
            text-align: center; margin-top: 6px; font-size: 11px; font-weight: 700;
            color: #d7c4ff; text-shadow: 0 1px 3px rgba(0,0,0,.8);
            letter-spacing: .5px; text-transform: uppercase;
        }

        /* ============ NÚT NẠP ĐẠN + KHO ĐẠN (góc dưới) ============ */
        #shoot-controls {
            position: absolute;
            left: 0; right: 0; bottom: max(14px, var(--safe-b));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            z-index: 30;
        }
        #ammoBox {
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            padding: 6px 18px;
            background: rgba(10,8,18,0.5);
            border: 1px solid rgba(255,203,5,0.3);
            border-radius: 14px;
            backdrop-filter: blur(4px);
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: clamp(14px, 3vw, 18px);
            color: var(--gold);
            min-width: 70px;
        }
        .ctrl-row { display: flex; gap: clamp(14px, 4vw, 26px); align-items: flex-end; pointer-events: none; }
        #btnAim {
            pointer-events: auto;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            width: clamp(58px, 12vw, 74px); height: clamp(58px, 12vw, 74px);
            border-radius: 50%;
            background: linear-gradient(160deg, rgba(122,92,255,0.3), rgba(40,24,80,0.5));
            border: 2.5px solid var(--violet);
            color: #e2d8ff;
            font-size: clamp(18px, 4vw, 22px);
            justify-content: center;
            box-shadow: 0 8px 22px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
            transition: transform .1s ease, background .15s ease, opacity .2s ease;
        }
        #btnAim .reload-label { font-size: 8px; font-weight: 800; font-family: 'Baloo 2', sans-serif; letter-spacing: .5px; }
        #btnAim:active { transform: scale(0.9); }
        #btnAim.active { background: rgba(122,92,255,0.55); border-color: #fff; box-shadow: 0 0 22px rgba(122,92,255,0.6); }
        #btnAim.hidden-weapon { opacity: 0.25; pointer-events: none; filter: grayscale(0.8); }
        #btnReload {
            pointer-events: auto;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            width: clamp(64px, 14vw, 84px); height: clamp(64px, 14vw, 84px);
            border-radius: 50%;
            background: linear-gradient(160deg, rgba(46,204,113,0.35), rgba(16,60,32,0.55));
            border: 2.5px solid var(--mint);
            color: #d6ffe6;
            font-size: clamp(20px, 4.4vw, 26px);
            justify-content: center;
            box-shadow: 0 8px 22px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
            transition: transform .1s ease, background .15s ease;
        }
        #btnReload .reload-label { font-size: 9px; font-weight: 800; font-family: 'Baloo 2', sans-serif; letter-spacing: .5px; }
        #btnReload:active { transform: scale(0.9); background: rgba(46,204,113,0.5); }
        #btnReload.reloading { animation: reloadSpin 0.65s linear; border-color: var(--gold); }
        @keyframes reloadSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #shoot-controls.locked { opacity: 0.3; pointer-events: none; filter: grayscale(0.7); }

        /* ============ QUIZ TIME BANNER ============ */
        #quiz-intro-banner {
            position: fixed; inset: 0; z-index: 4999;
            display: none; align-items: center; justify-content: center;
            background: transparent; pointer-events: none;
        }
        #quiz-intro-banner.show { display: flex; }
        #quiz-intro-banner .banner-wrap { position: relative; text-align: center; }
        #quiz-intro-banner .banner-txt {
            position: relative; z-index: 2;
            font-family: 'Baloo 2', sans-serif; font-size: clamp(30px, 8vw, 50px); font-weight: 800;
            color: var(--gold); text-shadow: 0 0 30px #ff9500, 3px 3px 0 #000;
            animation: countPulse 1s ease forwards;
        }
        #quiz-intro-banner .banner-ring {
            position: absolute; left: 50%; top: 50%; width: 40px; height: 40px;
            margin: -20px 0 0 -20px; border-radius: 50%;
            border: 3px solid rgba(255,203,5,0.7);
            animation: bannerRing .9s ease-out forwards;
        }
        @keyframes bannerRing { 0%{ transform: scale(0.5); opacity: 1; } 100%{ transform: scale(9); opacity: 0; } }

        /* ============ QUIZ MODAL (pkm_quiz.js tự bật/tắt display) ============ */
        #quiz-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(5, 4, 12, 0.92);
            backdrop-filter: blur(4px);
            z-index: 5000;
            padding: 16px;
        }
        .quiz-card {
            position: relative;
            background: linear-gradient(165deg, #191a33 0%, #100e22 100%);
            border: 2px solid rgba(255,203,5,0.55);
            border-radius: 22px;
            padding: 24px 20px;
            width: 100%;
            max-width: 440px;
            max-height: 88dvh;
            overflow-y: auto;
            box-shadow: 0 24px 70px rgba(0,0,0,0.65), 0 0 40px rgba(255,203,5,0.12);
            text-align: center;
        }
        .quiz-card::before {
            content: "🎯 QUIZ"; position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
            font-family: 'Baloo 2', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
            background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #241143;
            padding: 3px 14px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,.4);
        }
        .quiz-question { font-size: 16px; font-weight: bold; margin-bottom: 14px; color: #fff; line-height: 1.4; }
        .options-grid { display: grid; gap: 9px; width: 100%; }
        .option-btn {
            background: linear-gradient(160deg, #23243f, #191a30);
            border: 2px solid #3a3a5c; color: #fff;
            padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: bold;
            cursor: pointer; text-align: left;
            transition: border-color .15s ease, transform .1s ease, background .15s ease;
        }
        .option-btn:hover { border-color: rgba(255,203,5,0.6); }
        .option-btn:active { background: #2a2a50; transform: scale(0.98); }

        /* ============ THỐNG KÊ QUIZ (góc trái trên) ============ */
        #quiz-stats {
            position: fixed; top: calc(var(--safe-t) + 10px); left: 12px; z-index: 45;
            font-size: 11px; font-weight: 800;
            background: rgba(10,8,20,0.55);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 12px; border-radius: 20px;
            backdrop-filter: blur(4px);
            letter-spacing: .2px;
        }

        /* ============ VICTORY / DEFEAT ============ */
        #victory-overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 50% 30%, rgba(255,203,5,0.12), transparent 55%),
                linear-gradient(135deg, rgba(4,3,10,0.92) 0%, rgba(18,14,36,0.97) 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999; backdrop-filter: blur(6px); padding: 16px;
        }
        .victory-title {
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(28px, 7vw, 42px); font-weight: 800; color: var(--gold);
            text-shadow: 0 0 30px var(--gold), 0 0 60px var(--gold-deep); margin-bottom: 10px; text-align:center;
            animation: countPulse .8s ease-out;
        }
        .victory-img-wrap {
            position: relative; width: clamp(120px, 30vw, 160px); height: clamp(120px, 30vw, 160px);
            margin-bottom: 22px;
        }
        .victory-img-wrap::before {
            content: ""; position: absolute; inset: -18px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,203,5,0.35), transparent 70%);
            animation: dotPulse 2.4s ease-in-out infinite;
        }
        .victory-img { position: relative; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 26px rgba(255,203,5,0.6)); }
        .victory-exp {
            background: rgba(255, 203, 5, 0.1); border: 2px solid rgba(255,203,5,0.5); border-radius: 18px;
            padding: 16px 26px; font-size: 15px; font-weight: 700; color: #f3f0ff;
            margin-bottom: 26px; max-width: min(92vw, 420px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .btn-victory-back {
            background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #241143; border: none;
            padding: 15px 44px; border-radius: 30px; font-size: 16px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 10px 28px rgba(255,203,5,0.45);
            transition: transform .12s ease, box-shadow .12s ease;
            font-family: 'Baloo 2', sans-serif;
        }
        .btn-victory-back:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(255,203,5,0.55); }
        .btn-victory-back:active { transform: translateY(0) scale(0.97); }
    </style>
</head>
<body>
    <div class="game-viewport">
        <div id="top-bar">
            <div class="brand-badge"><span class="pika-dot"></span>Bird&nbsp;Shoot</div>
            <div class="hud-chip level" id="levelChip">🎯 Màn 1</div>
            <div class="hud-chip weapon" id="weaponChip">🔫 Súng lục</div>
            <div id="heartsBox">
                <span class="heart-icon" data-i="0">❤️</span>
                <span class="heart-icon" data-i="1">❤️</span>
                <span class="heart-icon" data-i="2">❤️</span>
                <span class="heart-icon" data-i="3">❤️</span>
                <span class="heart-icon" data-i="4">❤️</span>
                <span class="heart-icon" data-i="5">❤️</span>
                <span class="heart-icon" data-i="6">❤️</span>
                <span class="heart-icon" data-i="7">❤️</span>
                <span class="heart-icon" data-i="8">❤️</span>
                <span class="heart-icon" data-i="9">❤️</span>
            </div>
            <div class="hud-chip score"><span class="icon">⭐</span><span id="scoreValue">0</span></div>
        </div>

        <div id="shoot-stage">
            <canvas id="shootCanvas"></canvas>

            <div id="shoot-overlay-layer"></div>

            <div id="shoot-controls">
                <div id="ammoBox"><span id="ammoText">7 / 7</span></div>
                <div class="ctrl-row">
                    <div id="btnAim" class="hidden-weapon" onclick="BirdShootGame.toggleAim()">
                        <span>🔭</span>
                        <span class="reload-label">NGẮM</span>
                    </div>
                    <div id="btnReload">
                        <span>🔄</span>
                        <span class="reload-label">NẠP ĐẠN</span>
                    </div>
