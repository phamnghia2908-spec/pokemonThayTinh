<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Test hiệu ứng kỹ năng Pokémon</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #123;
      color: #fff;
      padding: 20px;
    }

    #skillList {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .skillItem {
      background: rgba(255,255,255,0.1);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .skillItem:hover {
      background: rgba(255,255,255,0.3);
    }

    #dummyPokemon {
      position: fixed;
      top: 60%;
      left: 80%;
      transform: translate(-50%, -50%);
      width: 120px;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h2>🎯 Danh sách kỹ năng Pokémon</h2>
  <div id="skillList"></div>

  <!-- Pokémon giả định để làm điểm xuất phát -->
  <img id="dummyPokemon" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu" />

  <script type="module">
    import { skillEffects } from './skillEffects.js';

    const skillList = document.getElementById("skillList");

    const dummy = document.getElementById("dummyPokemon");
    const rect = dummy.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;

    const targetX = window.innerWidth / 2;
    const targetY = window.innerHeight / 2;

    Object.keys(skillEffects).forEach(skillName => {
      const div = document.createElement("div");
      div.className = "skillItem";
      div.textContent = skillName;
      div.onclick = () => {
        const fn = skillEffects[skillName];
        if (typeof fn === "function") {
          fn(document.body, { x, y, targetX, targetY });
        }
      };
      skillList.appendChild(div);
    });
  </script>
</body>
</html>
