<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Skill - 18 Types Test</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #battle-scene {
            position: relative;
            width: 90%;
            max-width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #333, #111);
            border: 3px solid #444;
            border-radius: 15px;
            margin-top: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .pkm-unit {
            position: absolute;
            width: 120px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .pkm-sprite {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        #player-unit-0 { bottom: 40px; left: 80px; }
        #enemy-unit-0 { top: 40px; right: 80px; }

        .controls-container {
            width: 90%;
            max-width: 800px;
            margin: 20px 0;
            padding: 20px;
            background: #252525;
            border-radius: 12px;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-type {
            padding: 8px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            transition: transform 0.1s, brightness 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .btn-type:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-type:active { transform: translateY(0); }

        .special-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            border-top: 1px solid #444;
            padding-top: 15px;
        }

        .btn-special {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        select {
            padding: 10px;
            background: #333;
            color: white;
            border-radius: 5px;
            border: 1px solid #555;
        }

        /* Lớp phủ chế độ kỹ năng (nếu CSS pkm_skill chưa nạp) */
        .skill-mode .pkm-unit { transition: opacity 0.3s; }
    </style>
</head>
<body>

    <h2 style="color: #ffcb05; text-shadow: 2px 2px #3c5aa6;">Pokemon Skill Laboratory</h2>

    <div id="battle-scene">
        <div id="player-unit-0" class="pkm-unit" style="bottom: 40px; left: 80px;">
            <div class="pkm-sprite" style="background-image: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif');"></div>
            <div style="font-size: 12px; margin-top: 5px;">PIKACHU</div>
        </div>

        <div id="enemy-unit-0" class="pkm-unit" style="top: 20px; right: 80px;">
            <div class="pkm-sprite" style="background-image: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/150.gif');"></div>
            <div style="font-size: 12px; margin-top: 5px;">MEWTWO</div>
        </div>
        <div id="enemy-unit-1" class="pkm-unit" style="top: 150px; right: 180px;">
            <div class="pkm-sprite" style="background-image: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/66.gif');"></div>
            <div style="font-size: 12px; margin-top: 5px;">CHARIZARD</div>
        </div>
        <div id="enemy-unit-2" class="pkm-unit" style="top: 280px; right: 80px;">
            <div class="pkm-sprite" style="background-image: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/7.gif');"></div>
            <div style="font-size: 12px; margin-top: 5px;">SQUIRTLE</div>
        </div>
    </div>

    <div class="controls-container">
        <div style="margin-bottom: 10px; font-size: 14px; color: #aaa;">Chọn cấp độ sức mạnh (Gen): 
            <select id="gen-select">
                <option value="1">Gen 1 (Cơ bản)</option>
                <option value="2">Gen 2 (Vừa)</option>
                <option value="3">Gen 3 (Mạnh)</option>
                <option value="4">Gen 4 (Rất mạnh)</option>
                <option value="mega">Mega Evolution</option>
            </select>
        </div>

        <div id="type-buttons" class="grid-buttons">
            <!-- Nút các hệ sẽ tự động sinh ra ở đây -->
        </div>

        <div class="special-controls">
            <button class="btn-special" onclick="testNormalAttack()">Tấn công thường</button>
            <button class="btn-special" onclick="testMiss()" style="border-color: #feca57;">Test Hụt (Miss)</button>
        </div>
    </div>

    <script src="pkm_skill.js"></script>

    <script>
        // 1. Tự động tạo nút cho 18 hệ dựa trên SkillManager.systemConfig
        // 1. Thay thế phần tạo nút: mỗi hệ có 3 nút (S1, S2, S3)
        const typeContainer = document.getElementById('type-buttons');
        const types = Object.keys(SkillManager.systemConfig);

        typeContainer.innerHTML = ''; // Xóa nút cũ
        types.forEach(type => {
            const group = document.createElement('div');
            group.style.display = "flex";
            group.style.gap = "5px";
            group.style.alignItems = "center";
            group.innerHTML = `<span style="width:70px; font-size:10px;">${type.toUpperCase()}</span>`;

            for(let i = 1; i <= 3; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn-type';
                btn.innerText = `S${i}`; // Ghi S1, S2, S3
                btn.style.backgroundColor = SkillManager.systemConfig[type].color;
                btn.onclick = () => testSkill(type, i); // Truyền thêm index skill
                group.appendChild(btn);
            }
            typeContainer.appendChild(group);
        });

        // 2. Logic thi triển kỹ năng: Đánh vào 3 mục tiêu [0, 1, 2]
        async function testSkill(type, skillIdx) {
            const gen = document.getElementById('gen-select').value;
            const skillData = {
                attackerSide: 'player',
                attackerIndex: 0,
                targetSide: 'enemy',
                targets: [0, 1, 2], // Thay đổi từ [0] thành [0, 1, 2]
                type: type,
                skillIndex: skillIdx, // Truyền thêm skillIndex để SkillManager nhận diện
                gen: isNaN(gen) ? gen : parseInt(gen),
                damage: Math.floor(Math.random() * 80) + 20,
                isSkill: true,
                missed: false
            };

            console.log(`Test: Hệ ${type} - Skill ${skillIdx} - Cấp độ ${gen}`);
            await SkillManager.play(skillData);
        }

        // 3. Logic tấn công thường
        async function testNormalAttack() {
            await SkillManager.play({
                attackerSide: 'player',
                attackerIndex: 0,
                targetSide: 'enemy',
                targets: [0],
                damage: 15,
                isSkill: false,
                missed: false
            });
        }

        // 4. Logic test Hụt
        async function testMiss() {
            await SkillManager.play({
                attackerSide: 'player',
                attackerIndex: 0,
                targetSide: 'enemy',
                targets: [0],
                missed: true
            });
        }
    </script>
</body>
</html>
