<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pokémon Temple Dash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffcb05;
            --gold-deep: #ff9500;
            --ember: #ff6b6b;
            --mint: #2ecc71;
            --sky-cyan: #7ee6ff;
            --violet: #7a5cff;
            --ink: #0a0616;
            --panel: rgba(18, 12, 32, 0.72);
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
            background: #05030c;
            color: #fff;
            overscroll-behavior: none;
        }

        /* ============ NỀN TRANG TRÍ NGOÀI VIỀN ============ */
        body::before {
            content: "";
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 60% 40% at 20% 10%, rgba(122, 92, 255, 0.25), transparent 60%),
                radial-gradient(ellipse 50% 35% at 85% 15%, rgba(255, 149, 0, 0.18), transparent 60%),
                radial-gradient(ellipse 70% 50% at 50% 100%, rgba(255, 203, 5, 0.10), transparent 65%),
                linear-gradient(180deg, #0d0720 0%, #05030c 60%, #050308 100%);
            animation: bgDrift 18s ease-in-out infinite alternate;
        }
        @keyframes bgDrift {
            0% { filter: hue-rotate(0deg) brightness(1); }
            100% { filter: hue-rotate(8deg) brightness(1.08); }
        }

        .game-viewport {
            position: relative; z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            padding-top: var(--safe-t);
        }

        /* ============ THANH TRẠNG THÁI TRÊN CÙNG (HUD) ============ */
        #top-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(5px, 1.6vw, 12px);
            padding: clamp(8px, 1.6vh, 12px) clamp(10px, 3vw, 22px);
            background: linear-gradient(180deg, rgba(20,14,38,0.92) 0%, rgba(14,10,26,0.78) 100%);
            border-bottom: 1.5px solid rgba(255,203,5,0.4);
            box-shadow: 0 6px 24px rgba(0,0,0,0.45);
            position: relative;
            z-index: 40;
            backdrop-filter: blur(6px);
        }
        #top-bar::after {
            content: "";
            position: absolute; left: 0; right: 0; bottom: -1.5px; height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.7;
        }
        .brand-badge {
            display: flex; align-items: center; gap: 6px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: clamp(10px, 2vw, 14px);
            color: var(--gold);
            text-shadow: 0 0 12px rgba(255,203,5,0.5);
            letter-spacing: 0.3px;
            white-space: nowrap;
            opacity: 0.92;
        }
        .brand-badge .pika-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 60%, var(--gold-deep));
            box-shadow: 0 0 8px var(--gold);
            animation: dotPulse 1.6s ease-in-out infinite;
        }
        @keyframes dotPulse { 0%,100%{ transform: scale(1); opacity:1; } 50%{ transform: scale(1.35); opacity:.6; } }

        .hud-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: clamp(12px, 2.3vw, 17px);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,203,5,0.32);
            padding: clamp(4px,1vh,7px) clamp(8px,2vw,16px);
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 3px 10px rgba(0,0,0,0.3);
        }
        .hud-chip .icon { font-size: clamp(13px, 2.5vw, 18px); filter: drop-shadow(0 0 4px rgba(0,0,0,.5)); }
        .hud-chip.coins { color: #ffe38a; }
        .hud-chip.coins .icon { animation: coinSpinIcon 2.6s linear infinite; display: inline-block; }
        @keyframes coinSpinIcon { 0%{transform:rotateY(0);} 100%{transform:rotateY(360deg);} }
        .hud-chip.score { color: var(--sky-cyan); }
        .hud-chip.zone { color: #d7c4ff; padding: clamp(4px,1vh,7px) clamp(8px,1.6vw,12px); }
        .hud-chip.zone .icon { font-size: clamp(15px, 2.8vw, 20px); animation: none; }

        #heartsBox { display: flex; gap: 1.5px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 30vw; }
        #heartsBox .heart-icon {
            font-size: clamp(9px, 1.9vw, 14px);
            filter: drop-shadow(0 0 5px rgba(255,90,90,.75));
            transition: opacity .25s ease, filter .25s ease, transform .25s ease;
            animation: heartBeat 1.8s ease-in-out infinite;
        }
        #heartsBox .heart-icon:nth-child(2n) { animation-delay: .15s; }
        @keyframes heartBeat { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.12); } }
        .heart-lost { opacity: 0.18 !important; filter: grayscale(1) !important; transform: scale(0.85) !important; animation: none !important; }

        /* ============ SÂN CHƠI (CANVAS) — FULL BLEED, KHÁC NHAU PC/MOBILE THEO JS ============ */
        #race-stage {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 0%, #241143 0%, #0a0616 78%);
        }
        #raceCanvas {
            display: block;
            touch-action: none;
        }
        /* khung viền trang trí quanh mép sân chơi, không chặn thao tác */
        #race-stage::after {
            content: "";
            position: absolute; inset: 0; pointer-events: none; z-index: 25;
            box-shadow: inset 0 0 0 1px rgba(255,203,5,0.08), inset 0 120px 140px -120px rgba(0,0,0,0.7), inset 0 -160px 160px -120px rgba(0,0,0,0.65);
        }

        /* ============ KHUNG TRANG TRÍ 2 BÊN (dây leo + đuốc, kiểu Temple Run) ============ */
        .stage-deco {
            position: absolute; top: 0; bottom: 0; width: clamp(13px, 2.6vw, 24px);
            z-index: 26; pointer-events: none;
            background:
                repeating-linear-gradient(180deg, rgba(46,125,79,0.6) 0 16px, rgba(28,84,52,0.6) 16px 32px),
                linear-gradient(180deg, rgba(255,203,5,0.3), transparent 12%, transparent 88%, rgba(255,203,5,0.3));
            box-shadow: inset 0 0 14px rgba(0,0,0,0.55), 2px 0 10px rgba(0,0,0,0.35);
            transform-origin: top center;
            animation: vineSway 4.6s ease-in-out infinite;
            opacity: 0.9;
        }
        .stage-deco.left { left: 0; border-radius: 0 8px 8px 0; }
        .stage-deco.right { right: 0; border-radius: 8px 0 0 8px; animation-delay: -2.3s; }
        @keyframes vineSway { 0%,100%{ transform: rotate(-1deg);} 50%{ transform: rotate(1deg);} }
        .stage-deco::before, .stage-deco::after {
            content: "🍃"; position: absolute; font-size: 12px; left: 50%; transform: translateX(-50%);
            filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
        }
        .stage-deco::before { top: 20%; }
        .stage-deco::after { top: 58%; }
        .stage-deco.right::before { content: "🌿"; top: 30%; }
        .stage-deco.right::after { content: "🌿"; top: 70%; }

        .stage-corner-torch {
            position: absolute; top: 8px; z-index: 27; pointer-events: none;
            width: 26px; height: 26px;
        }
        .stage-corner-torch.left { left: 6px; }
        .stage-corner-torch.right { right: 6px; }
        .stage-corner-torch::before {
            content: ""; position: absolute; inset: -12px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,170,60,0.55), transparent 70%);
            animation: torchFlicker 1.4s ease-in-out infinite;
        }
        .stage-corner-torch::after { content: "🔥"; font-size: 16px; position: relative; z-index: 1; }
        @keyframes torchFlicker { 0%,100%{ opacity: .75; transform: scale(1);} 50%{ opacity: 1; transform: scale(1.14);} }

        /* ============ NÚT ĐIỀU KHIỂN NỔI ============ */
        #race-controls {
            position: absolute;
            left: 0; right: 0; bottom: max(14px, var(--safe-b));
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 clamp(16px, 4.5vw, 34px);
            pointer-events: none;
            z-index: 30;
        }
        .ctrl-cluster { display: flex; gap: clamp(8px, 2vw, 14px); pointer-events: auto; }
        .ctrl-btn {
            width: clamp(46px, 9vw, 58px); height: clamp(46px, 9vw, 58px);
            border-radius: 50%;
            background: linear-gradient(160deg, rgba(40,32,68,0.65), rgba(16,12,28,0.65));
            border: 2px solid rgba(255,203,5,0.5);
            backdrop-filter: blur(5px);
            color: var(--gold);
            font-size: clamp(18px, 4vw, 23px);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
            transition: transform .1s ease, background .15s ease, box-shadow .15s ease;
        }
        .ctrl-btn:active { transform: scale(0.86); background: rgba(255,203,5,0.28); box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12); }
        .ctrl-btn.jump { width: clamp(54px, 10.5vw, 68px); height: clamp(54px, 10.5vw, 68px); font-size: clamp(22px, 4.6vw, 27px); border-color: var(--mint); color: #9dffc0; }
        .ctrl-btn.slide { width: clamp(54px, 10.5vw, 68px); height: clamp(54px, 10.5vw, 68px); font-size: clamp(22px, 4.6vw, 27px); border-color: var(--ember); color: #ffb3b3; }
        #race-controls.locked { opacity: 0.3; pointer-events: none; filter: grayscale(0.7); transform: translateY(4px); }

        @media (hover: hover) and (pointer: fine) {
            #keyboard-hint {
                position: absolute; top: 14px; right: 16px; z-index: 30;
                display: flex; gap: 6px; align-items: center;
                background: rgba(14,10,26,0.55); border: 1px solid rgba(255,203,5,0.3);
                border-radius: 20px; padding: 6px 14px; backdrop-filter: blur(4px);
                font-size: 12px; color: #cbd0e8; font-weight: 600;
                animation: hintFade 6s ease forwards;
                pointer-events: none;
            }
            #keyboard-hint kbd {
                background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
                border-radius: 5px; padding: 1px 6px; font-family: inherit; color: #fff;
            }
            @keyframes hintFade { 0%,70%{ opacity: 1; } 100%{ opacity: 0; } }
        }
        @media (hover: none), (pointer: coarse) {
            #keyboard-hint { display: none; }
        }

        /* ============ MÀN HÌNH BẮT ĐẦU / ĐẾM NGƯỢC / CHỌN CẤP ĐỘ ============ */
        #race-overlay-layer {
            position: absolute; inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #race-overlay-layer.show { display: flex; }

        #tapStartCard {
            pointer-events: auto;
            text-align: center;
            animation: floatY 2.4s ease-in-out infinite;
        }
        @keyframes floatY { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
        #tapStartBtn {
            position: relative;
            width: clamp(96px, 24vw, 132px); height: clamp(96px, 24vw, 132px);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff 0 10%, #ff5252 12% 48%, #1c1c1c 50% 54%, #fff 56% 60%, #eee 62% 100%);
            border: 5px solid #1c1c1c;
            box-shadow: 0 0 46px rgba(255,203,5,0.6), 0 10px 30px rgba(0,0,0,.5);
            cursor: pointer;
        }
        #tapStartBtn::before, #tapStartBtn::after {
            content: ""; position: absolute; inset: -14px; border-radius: 50%;
            border: 2px solid rgba(255,203,5,0.55); animation: ringPulse 2.2s ease-out infinite;
        }
        #tapStartBtn::after { animation-delay: 1.1s; }
        @keyframes ringPulse {
            0% { transform: scale(0.85); opacity: 0.9; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        #tapStartCard .tap-label {
            margin-top: 18px;
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(16px, 3.4vw, 21px);
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 18px rgba(255,203,5,.6), 2px 2px 0 #000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #tapStartCard .tap-sub {
            margin-top: 6px;
            font-size: clamp(11px, 2.2vw, 13px);
            color: #b9b3d6;
            font-weight: 600;
        }

        .countdown-num {
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(80px, 20vw, 150px);
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 40px #ff9500, 4px 4px 0 #000;
            animation: countPulse .9s ease forwards;
        }
        @keyframes countPulse {
            0% { transform: scale(0.3); opacity: 0; }
            30% { transform: scale(1.15); opacity: 1; }
            60% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .go-text {
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(56px, 15vw, 100px);
            font-weight: 800;
            color: var(--mint);
            text-shadow: 0 0 40px var(--mint), 4px 4px 0 #000;
            animation: countPulse 1s ease forwards;
        }

        /* ============ CẤP ĐỘ CHỌN ============ */
        #mainCard { }
        .race-level-select-title {
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 800;
            color: var(--gold);
            text-shadow: 2px 2px 0 #000, 0 0 20px rgba(255,203,5,.4);
            margin-bottom: 22px;
        }
        .race-level-row { display: flex; gap: clamp(10px, 2.6vw, 18px); justify-content: center; flex-wrap: wrap; }
        .race-level-card {
            position: relative;
            background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
            border: 2px solid rgba(255,203,5,.35);
            border-radius: 20px;
            padding: clamp(16px, 3vw, 22px) clamp(18px, 4vw, 28px);
            text-align: center; cursor: pointer;
            min-width: clamp(108px, 22vw, 140px);
            box-shadow: 0 10px 26px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .race-level-card:hover { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 16px 34px rgba(0,0,0,0.5), 0 0 26px rgba(255,203,5,0.25); }
        .race-level-card:active { transform: scale(0.94) translateY(-2px); }
        .race-level-card .lv-emoji { font-size: clamp(30px, 7vw, 40px); filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
        .race-level-card .lv-label { font-family: 'Baloo 2', sans-serif; font-weight: 800; color: var(--gold); margin-top: 8px; font-size: clamp(14px, 3vw, 17px); }
        .race-level-card .lv-sub { font-size: clamp(10px, 2.2vw, 12px); color: #b9b3d6; margin-top: 5px; }

        /* ============ HƯỚNG DẪN CHƯỚNG NGẠI (hiện thoáng qua đầu ván) ============ */
        #obstacle-legend {
            position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
            z-index: 35; display: none;
            gap: 10px; padding: 8px 16px; border-radius: 16px;
            background: rgba(14,10,26,0.65); border: 1px solid rgba(255,203,5,0.28);
            backdrop-filter: blur(5px);
            font-size: 11px; font-weight: 700; color: #d7d2f0;
            flex-wrap: wrap; justify-content: center; max-width: 92%;
            animation: legendFade 5s ease forwards;
        }
        #obstacle-legend.show { display: flex; }
        #obstacle-legend span { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        @keyframes legendFade { 0%,75%{ opacity: 1; } 100%{ opacity: 0; } }

        /* ============ BANNER ĐỔI KHU VỰC ============ */
        #zone-banner {
            position: fixed; left: 50%; top: 20%; transform: translate(-50%, -18px);
            z-index: 4998; pointer-events: none; opacity: 0;
            transition: opacity .4s ease, transform .4s ease;
        }
        #zone-banner.show { opacity: 1; transform: translate(-50%, 0); }
        .zone-banner-txt {
            font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: clamp(18px, 4.6vw, 30px);
            color: #fff;
            background: linear-gradient(135deg, rgba(20,14,38,0.9), rgba(48,32,80,0.9));
            border: 2px solid rgba(255,203,5,0.6); border-radius: 30px; padding: 10px 30px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 0 34px rgba(255,203,5,0.28);
            text-shadow: 0 2px 4px rgba(0,0,0,.6);
            white-space: nowrap;
        }
        .zone-banner-sub {
            text-align: center; margin-top: 6px; font-size: 11px; font-weight: 700;
            color: #d7c4ff; text-shadow: 0 1px 3px rgba(0,0,0,.8);
            letter-spacing: .5px; text-transform: uppercase;
        }

        /* ============ THỐNG KÊ QUIZ (góc trái trên) ============ */
        #quiz-stats {
            position: fixed; top: calc(var(--safe-t) + 10px); left: 12px; z-index: 45;
            font-size: 11px; font-weight: 800;
            background: rgba(10,8,20,0.55);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 12px; border-radius: 20px;
            backdrop-filter: blur(4px);
            letter-spacing: .2px;
        }

        /* ============ QUIZ TIME BANNER ============ */
        #quiz-intro-banner {
            position: fixed; inset: 0; z-index: 4999;
            display: none; align-items: center; justify-content: center;
            background: transparent; pointer-events: none;
        }
        #quiz-intro-banner.show { display: flex; }
        #quiz-intro-banner .banner-wrap { position: relative; text-align: center; }
        #quiz-intro-banner .banner-txt {
            position: relative; z-index: 2;
            font-family: 'Baloo 2', sans-serif; font-size: clamp(30px, 8vw, 50px); font-weight: 800;
            color: var(--gold); text-shadow: 0 0 30px #ff9500, 3px 3px 0 #000;
            animation: countPulse 1s ease forwards;
        }
        #quiz-intro-banner .banner-ring {
            position: absolute; left: 50%; top: 50%; width: 40px; height: 40px;
            margin: -20px 0 0 -20px; border-radius: 50%;
            border: 3px solid rgba(255,203,5,0.7);
            animation: bannerRing .9s ease-out forwards;
        }
        @keyframes bannerRing { 0%{ transform: scale(0.5); opacity: 1; } 100%{ transform: scale(9); opacity: 0; } }

        /* ============ QUIZ MODAL (pkm_quiz.js tự bật/tắt display) ============ */
        #quiz-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(5, 4, 12, 0.92);
            backdrop-filter: blur(4px);
            z-index: 5000;
            padding: 16px;
        }
        .quiz-card {
            position: relative;
            background: linear-gradient(165deg, #191a33 0%, #100e22 100%);
            border: 2px solid rgba(255,203,5,0.55);
            border-radius: 22px;
            padding: 24px 20px;
            width: 100%;
            max-width: 440px;
            max-height: 88dvh;
            overflow-y: auto;
            box-shadow: 0 24px 70px rgba(0,0,0,0.65), 0 0 40px rgba(255,203,5,0.12);
            text-align: center;
        }
        .quiz-card::before {
            content: "🎯 QUIZ"; position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
            font-family: 'Baloo 2', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
            background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #241143;
            padding: 3px 14px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,.4);
        }
        .quiz-question { font-size: 16px; font-weight: bold; margin-bottom: 14px; color: #fff; line-height: 1.4; }
        .options-grid { display: grid; gap: 9px; width: 100%; }
        .option-btn {
            background: linear-gradient(160deg, #23243f, #191a30);
            border: 2px solid #3a3a5c; color: #fff;
            padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: bold;
            cursor: pointer; text-align: left;
            transition: border-color .15s ease, transform .1s ease, background .15s ease;
        }
        .option-btn:hover { border-color: rgba(255,203,5,0.6); }
        .option-btn:active { background: #2a2a50; transform: scale(0.98); }

        /* ============ VICTORY / DEFEAT ============ */
        #victory-overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 50% 30%, rgba(255,203,5,0.12), transparent 55%),
                linear-gradient(135deg, rgba(4,3,10,0.92) 0%, rgba(18,14,36,0.97) 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999; backdrop-filter: blur(6px); padding: 16px;
        }
        .victory-title {
            font-family: 'Baloo 2', sans-serif;
            font-size: clamp(28px, 7vw, 42px); font-weight: 800; color: var(--gold);
            text-shadow: 0 0 30px var(--gold), 0 0 60px var(--gold-deep); margin-bottom: 10px; text-align:center;
            animation: countPulse .8s ease-out;
        }
        .victory-img-wrap {
            position: relative; width: clamp(120px, 30vw, 160px); height: clamp(120px, 30vw, 160px);
            margin-bottom: 22px;
        }
        .victory-img-wrap::before {
            content: ""; position: absolute; inset: -18px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,203,5,0.35), transparent 70%);
            animation: dotPulse 2.4s ease-in-out infinite;
        }
        .victory-img { position: relative; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 26px rgba(255,203,5,0.6)); }
        .victory-exp {
            background: rgba(255, 203, 5, 0.1); border: 2px solid rgba(255,203,5,0.5); border-radius: 18px;
            padding: 16px 26px; font-size: 15px; font-weight: 700; color: #f3f0ff;
            margin-bottom: 26px; max-width: min(92vw, 420px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .btn-victory-back {
            background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #241143; border: none;
            padding: 15px 44px; border-radius: 30px; font-size: 16px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 10px 28px rgba(255,203,5,0.45);
            transition: transform .12s ease, box-shadow .12s ease;
            font-family: 'Baloo 2', sans-serif;
        }
        .btn-victory-back:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(255,203,5,0.55); }
        .btn-victory-back:active { transform: translateY(0) scale(0.97); }
    </style>
</head>
<body>
    <div class="game-viewport">
        <div id="top-bar">
            <div class="brand-badge"><span class="pika-dot"></span>Temple&nbsp;Dash</div>
            <div class="hud-chip zone"><span class="icon" id="zoneChip">🏛️</span></div>
            <div class="hud-chip coins"><span class="icon">🪙</span><span id="coinsValue">0</span></div>
            <div id="heartsBox">
                <span class="heart-icon" data-i="0">❤️</span>
                <span class="heart-icon" data-i="1">❤️</span>
                <span class="heart-icon" data-i="2">❤️</span>
                <span class="heart-icon" data-i="3">❤️</span>
                <span class="heart-icon" data-i="4">❤️</span>
                <span class="heart-icon" data-i="5">❤️</span>
                <span class="heart-icon" data-i="6">❤️</span>
                <span class="heart-icon" data-i="7">❤️</span>
                <span class="heart-icon" data-i="8">❤️</span>
                <span class="heart-icon" data-i="9">❤️</span>
            </div>
            <div class="hud-chip score"><span class="icon">⭐</span><span id="scoreValue">0</span></div>
        </div>

        <div id="race-stage">
            <canvas id="raceCanvas"></canvas>

            <div class="stage-deco left"></div>
            <div class="stage-deco right"></div>
            <div class="stage-corner-torch left"></div>
            <div class="stage-corner-torch right"></div>

            <div id="obstacle-legend">
                <span>⤒ NHẢY: đá / gai / hố / cân lắc</span>
                <span>⤓ TRƯỢT: cành cây / quái bay</span>
                <span>↔ ĐỔI LÀN: tường chắn</span>
            </div>

            <div id="keyboard-hint">
                <kbd>←</kbd><kbd>→</kbd> đổi làn &nbsp;·&nbsp; <kbd>↑</kbd> nhảy &nbsp;·&nbsp; <kbd>↓</kbd> trượt
            </div>

            <div id="race-overlay-layer"></div>

            <div id="race-controls">
                <div class="ctrl-cluster">
                    <div class="ctrl-btn left" id="btnLeft">◀</div>
                </div>
                <div class="ctrl-cluster">
                    <div class="ctrl-btn slide" id="btnSlide">⤓</div>
                    <div class="ctrl-btn jump" id="btnJump">⤒</div>
                </div>
                <div class="ctrl-cluster">
                    <div class="ctrl-btn right" id="btnRight">▶</div>
                </div>
            </div>
        </div>
    </div>

    <div id="quiz-stats">✅ 0 &nbsp; ❌ 0 &nbsp; 📊 0 câu</div>

    <div id="zone-banner">
        <div class="zone-banner-txt">🏛️ Đền Cổ</div>
        <div class="zone-banner-sub">Khu vực mới!</div>
    </div>

    <div id="quiz-intro-banner">
        <div class="banner-wrap">
            <div class="banner-ring"></div>
            <div class="banner-txt">🎯 QUIZ TIME!</div>
        </div>
    </div>

    <!-- QUIZ MODAL: pkm_quiz.js tự set display flex/none lên chính div này -->
    <div id="quiz-overlay">
        <div class="quiz-card">
            <div class="quiz-question" id="quiz-word">
                <div style="color:#888; font-size:13px;">⏳ Đang chuẩn bị câu hỏi...</div>
            </div>
            <div class="options-grid" id="quiz-options"></div>
        </div>
    </div>

    <!-- VICTORY / DEFEAT -->
    <div id="victory-overlay">
        <div class="victory-title" id="victory-title-text">🏆 HOÀN THÀNH!</div>
        <div class="victory-img-wrap">
            <img class="victory-img" id="victory-pkm-img"
                 src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
                 alt="Reward Pokemon">
        </div>
        <div class="victory-exp" id="victory-exp-text">+ 10 EXP</div>
        <button class="btn-victory-back" onclick="window.location.href='pkm_map.html'">
            🗺️ QUAY LẠI BẢN ĐỒ
        </button>
    </div>

    <script src="global-config.js"></script>
    <script src="tacham.js"></script>
    <script src="pkm_vocabulary.js"></script>
    <script type="module" src="pkm_quiz.js"></script>
    <script src="pkm_score.js"></script>
    <script src="pkm_race_background.js"></script>
    <script src="pkm_race.js"></script>
</body>
</html>
