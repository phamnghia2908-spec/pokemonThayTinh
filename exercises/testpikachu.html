<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu SVG Vector Chuẩn</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0; /* Nền trung tính để dễ nhìn */
            font-family: sans-serif;
        }
        .container {
            width: 500px;
            height: 500px;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            /* Tạo nền trời xanh và cỏ xanh */
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #32CD32 60%, #32CD32 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
          <defs>
            <style>
              .cls-yellow{fill:#FEE531;}.cls-yellow,.cls-brown,.cls-black,.cls-white,.cls-cheek-red,.cls-mouth-red{stroke:#000;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.5px;}
              .cls-brown{fill:#C06126;}
              .cls-black{fill:#000000;}
              .cls-white{fill:#ffffff;}
              .cls-cheek-red{fill:#FF3333;}
              .cls-mouth-red{fill:#F57F83;}
              .cls-outline{fill:none; stroke:#000; stroke-width: 2.5px;}
            </style>
          </defs>
          
          <g id="tail-group" transform="translate(130, 70)">
            <path class="cls-yellow" d="M300,195l-30,15L240,165l20-15l30,15Z"/>
            <path class="cls-yellow" d="M330,165l-20,15L270,195l30,15l20-15Z"/>
            <path class="cls-yellow" d="M360,195l-30-15l20-15l30,15l20-15Z"/>
            <path class="cls-brown" d="M210,180c10.49,0,19-8.51,19-19s-8.51-19-19-19-19,8.51-19,19S199.51,180,210,180Z"/>
            <path class="cls-outline" d="M334,175.7C308,188,281,201.7,257,194l-42-25.7-10,25s17,18,33,13.7c16-4.3,32-15.7,48.7-22C345,182,334,175.7,334,175.7Z"/>
          </g>
          
          <g id="body-group" transform="translate(150, 160)">
            <ellipse class="cls-yellow" cx="100" cy="120" rx="85" ry="105"/>
            <path class="cls-brown" d="M110,185h60v9h-60Z"/>
            <path class="cls-brown" d="M110,165h60v9h-60Z"/>
          </g>
          
          <g id="feet-group" transform="translate(150, 340)">
            <ellipse class="cls-yellow" cx="35" cy="30" rx="22" ry="14"/>
            <ellipse class="cls-yellow" cx="165" cy="30" rx="22" ry="14"/>
            <path class="cls-black" d="M28,38l-2,4.3C24,46,20,48,15,48H11V38ZM172,38l2,4.3C176,46,180,48,185,48h4V38Z"/>
          </g>
          
          <g id="arms-group" transform="translate(150, 210)">
            <path class="cls-yellow" d="M15,15c0-11,8.95-20,20-20h25a20,20,0,0,1,0,40H35c-11,0-20-8.95-20-20Z"/>
            <path class="cls-outline" d="M15,15s-10,30-20,10s20-20,20-20ZM60,15s10,30,20,10s-20-20-20-20Z"/>
            
            <path class="cls-yellow" d="M185,15c0-11-8.95-20-20-20H140a20,20,0,0,0,0,40H165c11,0,20-8.95,20-20Z"/>
            <path class="cls-outline" d="M185,15s10,30,20,10s-20-20-20-20ZM140,15s-10,30-20,10s20-20,20-20Z"/>
          </g>
          
          <g id="head-group" transform="translate(150, 60)">
            <circle class="cls-yellow" cx="100" cy="100" r="95"/>
            
            <g transform="translate(15, -15)">
              <path class="cls-yellow" d="M-10,10c0-16.57,13.43-30,30-30H55c16.57,0,30,13.43,30,30s-13.43,30-30,30H20C3.43,40-10,26.57-10,10Z"/>
              <path class="cls-black" d="M10,10c0-11,8.95-20,20-20h25c11,0,20,8.95,20,20s-8.95,20-20,20H30c-11,0-20-8.95-20-20Z"/>
            </g>
            
            <g transform="translate(145, -15)">
              <path class="cls-yellow" d="M10,10c0-16.57,13.43-30,30-30H75c16.57,0,30,13.43,30,30S91.57,40,75,40H40C23.43,40,10,26.57,10,10Z"/>
              <path class="cls-black" d="M35,10c0-11-8.95-20-20-20H-10c-11,0-20,8.95-20,20s8.95,20,20,20h25c11,0,20-8.95,20-20Z"/>
            </g>
            
            <circle class="cls-cheek-red" cx="45" cy="135" r="30"/>
            <circle class="cls-cheek-red" cx="155" cy="135" r="30"/>
            
            <g id="eyes" transform="translate(45, 85)">
              <circle class="cls-black" cx="0" cy="0" r="15"/>
              <circle class="cls-white" cx="4" cy="-4" r="4.5"/>
              <circle class="cls-black" cx="110" cy="0" r="15"/>
              <circle class="cls-white" cx="114" cy="-4" r="4.5"/>
            </g>
            
            <circle class="cls-black" cx="100" cy="120" r="4.5"/>
            
            <path class="cls-mouth-red" d="M100,145c10,0,20,6.7,20,15s-10,15-20,15-20-6.7-20-15S90,145,100,145Z"/>
            <path class="cls-outline" d="M80,150c10,0,20,10,30,5,10-5,20,5,30,5s20,0,20,0l-10,10s-10,5-20,5S110,170,100,170s-10,0-20,0L80,150Z"/>
          </g>
          
        </svg>
    </div>
</body>
</html>
